services:
  frontend:
    build: ./ase220-group-project-frontend
    ports:
      - "80:80"

  backend:
    build: ./ase220-group-project-backend
    environment:
      PORT: 3000
      MONGO_URI: mongodb://db:27017/notes
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./ase220-group-project-backend/src:/app/src
    depends_on:
      - db

  db:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodata:/data/db

volumes:
  mongodata:
