services:
  frontend:
    build: ./ase220-group-project-frontend
    ports:
      - "5173:5173"

  backend:
    build: ./ase220-group-project-backend
    ports:
      - "3000:3000"
    depends_on:
      - db
    profiles:
      - disabled

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
